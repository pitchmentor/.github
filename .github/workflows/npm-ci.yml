name: npm package CI

# Reusable: build and test an npm package on every supported Node version.
#   jobs:
#     test:
#       uses: pitchmentor/.github/.github/workflows/npm-ci.yml@<sha> # v1

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package contents
        if: matrix.node == 22
        run: npm pack --dry-run
